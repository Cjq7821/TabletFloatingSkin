plugins {
    alias(libs.plugins.agp.application)
    alias(libs.plugins.kotlin.android)
}

android {
    compileSdk COMPILE_SDK
    namespace "com.cjq7821.poweramp.v3.skins.tabletfloating"

    defaultConfig {
        minSdk MIN_SDK
        targetSdk TARGET_SDK
        versionCode 1
        versionName "1.0"
    }

    // 皮肤验证说明：Poweramp 会校验发布签名。调试包用 debug key 签名不会被校验，
    // 如需在开发期验证签名，可在此配置 release 签名并强制 debug 使用：
    //signingConfigs {
    //    release { ... }
    //}
    //buildTypes {
    //    debug { signingConfig signingConfigs.release }
    //}

    compileOptions {
        sourceCompatibility = JAVA_SOURCE_COMPATIBILITY
        targetCompatibility = JAVA_TARGET_COMPATIBILITY
    }
    lint {
        disable 'ResAuto', 'MissingTranslation', 'OnClick', 'ExtraTranslation'
    }

    androidResources {
        // 皮肤需要引用 Poweramp 的样式/属性（com.maxmpz.audioplayer:*），
        // 因此编译时通过 -I 引入 Poweramp 资源包，并用 --package-id 0x80 避免资源 ID 冲突。
        def localPropsFile = rootProject.file("local.properties")
        def paResources = "Poweramp-build-1026-resources.zip"
        if(localPropsFile.exists()) {
            def localProps = new Properties()
            localProps.load(localPropsFile.newDataInputStream())
            paResources = localProps['poweramp.apk'] ?: paResources
        }
        println "Using $paResources PA resources"

        def params = []
        params += ["--emit-ids", "${projectDir}/stable-ids.txt", "--package-id", "0x80", "-I", "${rootProject.projectDir}/${paResources}"]

        if(project.file("stable-ids.txt").exists()) {
            println "Got stable-ids OK"
            params += ["--stable-ids", "${projectDir}/stable-ids.txt"]
        } else {
            println "WARNING: no stable-ids.txt specified"
        }

        additionalParameters = params
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation project(path: ':poweramp_api_lib')
    implementation libs.androidx.appcompat.resources
    implementation libs.androidx.core.ktx
}
